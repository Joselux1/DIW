<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Imagenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>

        <h1 class= "text-dark d-flex justify-content-center">Listado Dinámico con Imagenes (Lazy Load)</h1>

             <p class =" d-flex justify-content-center">Selecciona el número de filas</p>
        <select class=" w-25  p-2 form-select container-sm"  name="desplegable" id ="desplegable">
            <option value="5">fila 5</option>
            <option value="10">fila 10</option>
            <option value="20">fila 20</option>
            <option value="50">fila 50</option>
        </select>

        <div class="container-sm">
            <table class="table">
                <thead class="table-dark " >
                  <tr>
                    <th scope="col">Imagenes</th>
                    <th scope="col">ID</th>
                    <th scope="col">Descripción</th>
                  </tr>
                </thead>
                <tbody id="filas">
                
                </tbody>
              </table>
              
        </div>


        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        
       </body>
        </html>
