<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js"></script>
    <title>Web Interactiva</title>
</head>
<body id="default" class="modo-Claro">
    <header class="header">
        <h1>Bienvenido a la Web Interactiva</h1>
        <nav>
            <ul class="nav-enlaces">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Contenido</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <div class="theme-controls">
            <button  id="cambiarColor">Cambiar Tema</button>
            <button onclick="aumentarTexto()">Aumentar Texto</button>
            <button onclick="leerPagina()">Leer Página Voz</button>
        </div>
    </header>
    <main>
        <section class="content">
            <h2>Contenido Principal</h2>
            <p>Esta es una página web interactiva con diversas funcionalidades.</p>
            <button onclick="cambiarColorFondo()">Cambiar color de fondo</button>
        </section>
        <section class="click-counter">
            <h2>Contador de clics</h2>
            <p id="contador">Has hecho clic 0 veces.</p>
            <button onclick="incrementarContador()">Haz clic aquí</button>
        </section>
    </main>
    <footer>
        <p>Contacto: <a href="mailto:contacto@webinteractiva.com">contacto@webinteractiva.com</a></p>
    </footer>


</body>
</html>
