<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="style.css">
   <script src="jquery-3.7.1.js"></script>
   <script src="main.js"></script>

</head>
<body>

  <div class="container mt-5 ">
    
   <h1 class="text-center">To-Do List Interactiva</h1>
    <div class="mb-3">
      <input type="text" id ="añadirTarea" class="form-control mb-2" placeholder="Añadir nueva tarea...">
      <button class="btn btn-primary " id ="guardarDatos">Añadir</button>
    </div>
    <hr>
    <table class="table w-100"  >
      <tbody id ="cuerpoTabla">
      
      </tbody>
    </table>
    <div>
      <button class="btn btn-primary m-1">Todas</button>
      <button class="btn btn-secondary m-1">Completadas</button>
      <button class="btn btn-secondary m-1">Pendientes</button>
    </div>
  </div> 

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
